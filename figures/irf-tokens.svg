<title id="irf-tokens-title">Implement → review → fix: tokens per scored workflow</title>
<desc id="irf-tokens-desc">Mean tokens per scored workflow by billing category, across all roles, over workflows whose counts are exact; n is shown and inexact workflows are counted separately. Token counts are per vendor and not comparable across tokenisers. Data table: irf-tokens.csv.</desc>
