<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="solo-cost-title solo-cost-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
<title id="solo-cost-title">Solo: estimated cost per accepted workflow</title>
<desc id="solo-cost-desc">Total API-equivalent estimated cost of all scored workflows, including failures, divided by accepted workflows, with a within-condition percentile bootstrap. Undefined (zero accepted), unavailable and lower-bound figures are written out rather than plotted as values. Not subscription charges. Data table: solo-cost.csv.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6f6e69; }
  .grid { stroke: #e4e3de; stroke-width: 1; } .axis { stroke: #b9b8b2; stroke-width: 1; }
  .ref { stroke: #6f6e69; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .off { fill: #2a78d6; stroke: #2a78d6; } .on { fill: #eb6834; stroke: #eb6834; }
  .hollow { fill: #fcfcfb; stroke-width: 2; }
  .ci { stroke-width: 2; fill: none; stroke-linecap: round; }
  .med { stroke: #0b0b0b; stroke-width: 2; }
  .k1 { fill: #2a78d6; } .k2 { fill: #eb6834; } .k3 { fill: #1baf7a; } .k4 { fill: #eda100; }
  .seg { stroke: #fcfcfb; stroke-width: 2; }
  .band { fill: #f3f2ee; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .hollow { fill: #1a1a19; } .seg { stroke: #1a1a19; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #9d9c94; }
    .grid { stroke: #33332f; } .axis { stroke: #5a5953; } .ref { stroke: #9d9c94; }
    .off { fill: #3987e5; stroke: #3987e5; } .on { fill: #d95926; stroke: #d95926; }
    .med { stroke: #f0efec; } .band { fill: #232321; }
    .k1 { fill: #3987e5; } .k2 { fill: #d95926; } .k3 { fill: #199e70; } .k4 { fill: #c98500; }
  }</style>
<rect class="bg" width="760" height="334"/>
<text class="t1" x="16" y="26" font-size="16" font-weight="600">Solo: estimated cost per accepted workflow</text>
<text class="t2" x="16" y="46">cohort-03 · 240 scored workflows · cost.dev prices 2026-11-13</text>
